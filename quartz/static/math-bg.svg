        <text x="300" y="200" font-family="serif" font-size="20">∑</text>
        <text x="150" y="300" font-family="serif" font-style="italic" font-size="22">e^(iπ) + 1 = 0</text>
        <path d="M600,100 C 650,150 700,50 750,100" />
