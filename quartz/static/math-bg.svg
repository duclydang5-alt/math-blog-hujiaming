<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#57a773" stroke-width="1.5" stroke-opacity="0.15">
        <path d="M100,150 q 50,-50 100,0 t 100,0" />
